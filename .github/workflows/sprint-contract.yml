name: Sprint reports contract
on:
  pull_request:
    paths:
      - 'data/sprints/**'
      - 'scripts/sprint-contract.mjs'
      - 'tests/sprint-contract.test.mjs'
      - '.github/workflows/sprint-contract.yml'
  push:
    branches: [main]
    paths:
      - 'data/sprints/**'
      - 'scripts/sprint-contract.mjs'
      - 'tests/sprint-contract.test.mjs'
      - '.github/workflows/sprint-contract.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sprint history and delivery evidence contract
        run: node --test tests/sprint-contract.test.mjs
