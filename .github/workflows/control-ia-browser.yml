name: CONTROL IA — Recette navigateur Chromium
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'data/control-ia-delivery.json'
      - 'data/projects.json'
      - 'index.html'
      - 'tests/control-ia-browser-smoke.mjs'
      - '.github/workflows/control-ia-browser.yml'
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'data/control-ia-delivery.json'
      - 'data/projects.json'
      - 'index.html'
      - 'tests/control-ia-browser-smoke.mjs'
      - '.github/workflows/control-ia-browser.yml'
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: control-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    if: github.event_name != 'deployment_status'
    name: Interface, consentement, persistance et mobile
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier Chrome préinstallé
        run: |
          command -v google-chrome || command -v chromium
          node --check tests/control-ia-browser-smoke.mjs
      - name: Recette réelle dans Chromium isolé
        run: node tests/control-ia-browser-smoke.mjs
  # A fresh push is NOT evidence of already deployed pages; only a finished deployment is.
  published:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'github-pages'
    name: Recette Chromium après publication Pages sur main
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Lire main sans conserver de jeton
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: Comparer commit publié et main actuel
        id: version
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          MAIN_SHA="$(git rev-parse HEAD)"
          if [ "$MAIN_SHA" = "$DEPLOY_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Déploiement $DEPLOY_SHA dépassé par main $MAIN_SHA ; contrôle en ligne de cette ancienne version ignoré."
          fi
      - name: Installer Node 22
        if: steps.version.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôler Chromium et syntaxe de recette
        if: steps.version.outputs.current == 'true'
        run: |
          command -v google-chrome || command -v chromium
          node --check tests/control-ia-browser-smoke.mjs
      - name: Comparer octets de Pages puis naviguer en Chromium
        if: steps.version.outputs.current == 'true'
        env:
          CONTROL_BROWSER_PRODUCTION: '1'
        run: node tests/control-ia-browser-smoke.mjs
