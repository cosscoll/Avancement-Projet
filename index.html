<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fa"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg"><title>CONTROL · Mes projets</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17202d;background:#f7f8fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{max-width:1050px;margin:auto;padding:20px 18px 110px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0 27px}.logo{font-size:19px;letter-spacing:-.6px;font-weight:800}.logo span{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:9px;border-radius:11px;background:#1e3257;color:#fff}.quiet{color:#687587;font-size:13px}h1{font-size:clamp(26px,5vw,37px);letter-spacing:-1.1px;margin:10px 0 7px}h2{font-size:20px;margin:0 0 9px}p{line-height:1.55;margin:8px 0 16px}.toprow,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.button,button{border:1px solid #dfe4ed;background:white;border-radius:12px;padding:11px 14px;color:#223149;font-weight:650;min-height:43px}.button.primary,button.primary{background:#273f68;border-color:#273f68;color:white}.button:hover,button:hover{border-color:#9baecb}.button:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8bbcfb;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:13px;margin:24px 0}.card,.panel{background:#fff;border:1px solid #e4e8ee;box-shadow:0 3px 16px #13294a09;border-radius:18px}.card{display:block;padding:21px;min-height:170px;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:#abc0da}.badge{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#eaf0fa;color:#304c7a;font-weight:800;letter-spacing:-.7px;margin-bottom:21px}.card strong{display:block;font-size:17px;margin-bottom:5px}.card small{color:#758296}.panel{padding:21px;margin:17px 0}.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;border-bottom:1px solid #e1e7ef;scrollbar-width:thin}.tabs button{white-space:nowrap;border-radius:10px}.tabs button[aria-selected="true"]{background:#e8eef9;border-color:#b7c9e7;color:#193b72}.field{display:block;width:100%;border:1px solid #d8e0eb;border-radius:11px;padding:12px 13px;background:white;margin:7px 0 12px;min-height:45px}textarea.field{min-height:105px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.links{display:grid;gap:10px}.link{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #e3e8ef;border-radius:12px;padding:13px 14px;overflow-wrap:anywhere}.link:hover{background:#f4f7fb}.muted{font-size:13px;color:#64758a}.notice{border-left:3px solid #7b9bc9;background:#f0f5fc;padding:11px 14px;border-radius:8px;color:#384b65;font-size:13px}.empty{padding:25px;background:#f6f8fb;border-radius:12px;color:#64758a}.hidden{display:none!important}.back{display:inline-flex;align-items:center;gap:7px;margin:4px 0 10px;color:#526b8e;font-size:14px}.chatrow{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0f4;padding:15px 0}.chatrow:last-child{border:0}.chatrow strong{display:block;margin-bottom:4px;overflow-wrap:anywhere}.chatrow small{color:#758296}.actions{display:flex;gap:6px;flex-wrap:wrap}form label{font-size:13px;font-weight:650;color:#475971}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.chip{font-size:12px;background:#eef2f7;padding:6px 9px;border-radius:8px;color:#51627a}.mobilefoot{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(16px);border-top:1px solid #e1e6ed;display:flex;justify-content:space-evenly;padding:10px 14px max(10px,env(safe-area-inset-bottom));z-index:3}.mobilefoot button{border:0;background:transparent;font-size:12px;min-height:42px}.search{max-width:420px}.hint{padding:12px 0}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#233553;color:white;border-radius:12px;padding:12px 17px;z-index:5;max-width:90vw}.danger{color:#9e3838}@media(max-width:640px){.wrap{padding:16px 14px 100px}.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px;min-height:143px}.badge{margin-bottom:13px}.card strong{font-size:14px}.panel{padding:15px}.row .button{font-size:13px}.desktoponly{display:none}}@media(max-width:370px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><a href="#/" class="logo"><span>◈</span>CONTROL</a><span class="quiet">Mes espaces projets</span></header><main id="main" aria-live="polite"><p>Chargement des projets…</p></main><div class="quiet" style="margin-top:28px">CONTROL · Liens et notes enregistrés sur cet appareil · <a href="legacy.html" style="text-decoration:underline">Ancien tableau de bord</a></div></div><nav class="mobilefoot"><button data-go="home">▦<br>Projets</button><button data-go="current">▤<br>Espace ouvert</button><button data-go="settings">⌁<br>Connexions</button></nav><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s), base='control-hub-v2', OWNER='cosscoll';
const load=()=>{try{return JSON.parse(localStorage.getItem(base)||'{}')}catch{return{}}};
let state=load(),projects=[],active=null,tab='discussions';
const persist=()=>{try{localStorage.setItem(base,JSON.stringify(state))}catch{notify('Stockage local indisponible')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc;
const link=u=>{try{const x=new URL(u);return x.protocol==='https:'&&!x.username&&!x.password?x.href:''}catch{return''}};
const chatHost=u=>{try{const x=new URL(u);return x.protocol==='https:'&&['chatgpt.com','claude.ai','gemini.google.com','aistudio.google.com','github.com','perplexity.ai','poe.com'].includes(x.hostname)}catch{return false}};
const nameOf=p=>p.name||p.short||p.id;
function notify(msg){const n=$('#toast');n.textContent=msg;n.classList.remove('hidden');clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>n.classList.add('hidden'),3600)}
function scoped(id){state[id]??={chats:[],links:[],memo:'',projectUrl:'',agents:[]};return state[id]}
function external(url,label,cls='link'){const safe=link(url);return safe?'<a class="'+cls+'" href="'+attr(safe)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+' <span aria-hidden="true">↗</span></a>':''}
function go(id,t='discussions'){tab=t;location.hash='#/project/'+encodeURIComponent(id)+'/'+t;render()}
function route(){const s=decodeURIComponent(location.hash.slice(1));const m=s.match(/^\/project\/([^/]+)(?:\/([^/]+))?/);return m?{id:m[1],tab:m[2]||'discussions'}:{id:null,tab:s==='/settings'?'settings':'home'}}
function home(){active=null;const search='<input id="search" class="field search" type="search" aria-label="Rechercher un projet" placeholder="Rechercher un projet…" autocomplete="off">';
$('#main').innerHTML='<div class="toprow"><div><div class="quiet">ESPACE DE TRAVAIL</div><h1>Mes projets</h1><p class="muted">Un projet, ses conversations, ses IA et ses ressources.</p></div><button id="add-project" class="primary">+ Ajouter</button></div>'+search+'<div id="cards" class="grid"></div><div class="notice">Les projets et conversations privés de ChatGPT ne peuvent pas être importés automatiquement depuis ce site statique. Ajoute leurs liens une seule fois sur cet appareil pour y accéder.</div><section id="add-box" class="panel hidden"><h2>Nouveau projet</h2><form id="new-project"><label>Nom du projet<input class="field" name="name" required maxlength="90" placeholder="Ex. Mon nouveau projet"></label><label>Lien du projet ChatGPT (facultatif)<input name="url" class="field" type="url" placeholder="https://chatgpt.com/g/g-p-…"></label><button class="primary">Créer l’espace</button></form></section>';
const draw=()=>{const q=($('#search').value||'').toLowerCase().trim();$('#cards').innerHTML=projects.filter(p=>nameOf(p).toLowerCase().includes(q)).map(p=>'<a class="card" href="#/project/'+encodeURIComponent(p.id)+'/discussions"><div class="badge">'+esc(p.symbol||nameOf(p).slice(0,2).toUpperCase())+'</div><strong>'+esc(nameOf(p))+'</strong><small>'+esc(p.category||'Espace projet')+'</small></a>').join('')||'<p class="empty">Aucun projet trouvé.</p>'};
draw();$('#search').oninput=draw;$('#add-project').onclick=()=>$('#add-box').classList.toggle('hidden');
$('#new-project').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')).trim(),url=String(fd.get('url')).trim();if(!name)return;if(url&&!chatHost(url)){notify('Utilise un lien ChatGPT valide.');return}const id='custom-'+Date.now();const p={id,name,symbol:name.slice(0,2).toUpperCase(),category:'Projet personnalisé'};state.custom??=[];state.custom.push(p);scoped(id).projectUrl=url;persist();projects.push(p);go(id)};
}
function workspace(p,t){active=p.id;tab=t;const d=scoped(p.id),tabs=[['discussions','Conversations'],['ai','Espaces IA'],['resources','Ressources'],['pilot','Gestion'],['connect','Connexions']];
const nav=tabs.map(([id,label])=>'<button data-tab="'+id+'" role="tab" aria-selected="'+(id===t)+'">'+label+'</button>').join('');
$('#main').innerHTML='<a class="back" href="#/">← Tous les projets</a><div class="toprow"><div><span class="quiet">'+esc(p.category||'Projet')+'</span><h1>'+esc(nameOf(p))+'</h1><p class="muted">'+esc(p.tagline||p.summary||'Centralisez vos espaces de travail.')+'</p></div>'+external(d.projectUrl,'Ouvrir dans ChatGPT','button')+'</div><div class="tabs" role="tablist">'+nav+'</div><div id="section"></div>';
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(p.id,b.dataset.tab));
const target=$('#section');
if(t==='resources')resources(p,d,target);
else if(t==='ai')ai(p,d,target);
else if(t==='pilot')pilot(p,d,target);
else if(t==='connect')connections(p,d,target);
else discussions(p,d,target);
}
function discussions(p,d,el){
const chats=d.chats||[];
el.innerHTML='<section class="panel"><div class="sectionhead"><div><h2>Discussions du projet</h2><span class="muted">'+chats.length+' conversation(s) liées manuellement</span></div><button class="primary" id="show-chat">+ Ajouter un chat</button></div><div class="notice">Pour répondre dans un chat existant, ouvre sa conversation ChatGPT ou l’IA concernée. CONTROL n’a pas accès aux messages privés depuis GitHub Pages.</div><div id="chat-list">'+(chats.length?chats.map((c,i)=>'<div class="chatrow"><div><strong>'+esc(c.title)+'</strong><small>'+esc(c.ai||'ChatGPT')+'</small></div><div class="actions">'+external(c.url,'Ouvrir','button')+'<button data-remove-chat="'+i+'" aria-label="Délier la conversation">×</button></div></div>').join(''):'<p class="empty">Aucune conversation liée. Ajoute le lien d’un chat du projet.</p>')+'</div><form id="chat-form" class="hidden" style="margin-top:20px"><label>Nom de la discussion<input class="field" name="title" required maxlength="100" placeholder="Ex. Développement application"></label><label>IA<input class="field" name="ai" list="ai-list" placeholder="ChatGPT" value="ChatGPT"><datalist id="ai-list"><option>ChatGPT</option><option>Codex</option><option>Claude</option><option>Gemini</option><option>Autre</option></datalist></label><label>Lien de la conversation<input class="field" type="url" name="url" required placeholder="https://chatgpt.com/c/…"></label><button class="primary">Lier la conversation</button></form></section><section class="panel"><h2>Créer une conversation</h2><p class="muted">Ouvre un nouveau chat dans ton IA. Pour qu’il appartienne à ce projet ChatGPT, crée-le depuis le projet dans ChatGPT, puis reviens coller son lien ici.</p><div class="actions">'+external(d.projectUrl,'Ouvrir le projet ChatGPT','button primary')+external('https://chatgpt.com/','ChatGPT nouveau chat','button')+external('https://chatgpt.com/codex','Codex','button')+'</div></section>';
$('#show-chat').onclick=()=>$('#chat-form').classList.toggle('hidden');
$('#chat-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),url=String(f.get('url')).trim();if(!chatHost(url)){notify('Lien de conversation non reconnu.');return}d.chats.push({title:String(f.get('title')).trim(),ai:String(f.get('ai')).trim()||'ChatGPT',url});persist();discussions(p,d,el)};
el.querySelectorAll('[data-remove-chat]').forEach(b=>b.onclick=()=>{d.chats.splice(Number(b.dataset.removeChat),1);persist();discussions(p,d,el)});
}
function ai(p,d,el){
const known=['ChatGPT','Codex','Claude','Gemini','Perplexity','Autre'],chats=d.chats||[];
el.innerHTML='<section class="panel"><h2>IA connectées à cet espace</h2><p class="muted">Chaque IA regroupe les liens de ses conversations. Une « connexion » ici est un raccourci, pas un accès API privé.</p><div class="grid">'+known.map(ai=>'<a class="card" href="#/project/'+encodeURIComponent(p.id)+'/discussions" data-ai="'+ai+'"><div class="badge">'+esc(ai.slice(0,2))+'</div><strong>'+esc(ai)+'</strong><small>'+chats.filter(c=>(c.ai||'ChatGPT').toLowerCase()===ai.toLowerCase()).length+' conversation(s) · Voir ci-dessous</small></a>').join('')+'</div></section>'+known.map(ai=>{const arr=chats.filter(c=>(c.ai||'ChatGPT').toLowerCase()===ai.toLowerCase());return '<section class="panel"><div class="sectionhead"><h2>'+esc(ai)+'</h2>'+external(({ChatGPT:'https://chatgpt.com/',Codex:'https://chatgpt.com/codex',Claude:'https://claude.ai/',Gemini:'https://gemini.google.com/',Perplexity:'https://www.perplexity.ai/'})[ai]||'','Ouvrir '+ai,'button')+'</div>'+(arr.length?arr.map(c=>external(c.url,c.title)).join(''):'<p class="muted">Aucun chat lié à '+esc(ai)+'.</p>')+'</section>'}).join('');
el.querySelectorAll('[data-ai]').forEach(a=>a.onclick=()=>{setTimeout(()=>{$('#show-chat')?.click();const f=$('#chat-form [name=ai]');if(f)f.value=a.dataset.ai},30)});
}
function resources(p,d,el){
const defaults=[...(p.repo?[{label:'Dépôt GitHub',url:'https://github.com/'+OWNER+'/'+encodeURIComponent(p.repo)}]:[]),...(p.website?.url?[{label:p.website.label||'Site web',url:p.website.url}]:[]),...(p.other_sites||[]),...(d.projectUrl?[{label:'Projet ChatGPT',url:d.projectUrl}]:[])],links=[...defaults,...(d.links||[])];
el.innerHTML='<section class="panel"><div class="sectionhead"><h2>Ressources et accès</h2><button class="primary" id="show-link">+ Ajouter</button></div><div class="links">'+(links.length?links.map((x,i)=>'<div class="row">'+external(x.url,x.label,'link')+(i>=defaults.length?'<button data-del="'+(i-defaults.length)+'" aria-label="Supprimer">×</button>':'')+'</div>').join(''):'<div class="empty">Aucune ressource enregistrée.</div>')+'</div><form class="hidden" id="link-form" style="margin-top:17px"><label>Nom de la ressource<input class="field" required name="label" placeholder="Drive du projet"></label><label>Adresse HTTPS<input class="field" required type="url" name="url" placeholder="https://drive.google.com/…"></label><button class="primary">Ajouter</button></form></section>';
$('#show-link').onclick=()=>$('#link-form').classList.toggle('hidden');
$('#link-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),url=link(f.get('url'));if(!url)return notify('Adresse HTTPS obligatoire.');d.links.push({label:String(f.get('label')).trim(),url});persist();resources(p,d,el)};
el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{d.links.splice(+b.dataset.del,1);persist();resources(p,d,el)});
}
function pilot(p,d,el){
el.innerHTML='<section class="panel"><h2>Gestion du projet</h2><p class="muted">Notes locales de coordination. Elles ne sont pas envoyées automatiquement à ChatGPT ou à Codex.</p><label for="memo">Consignes et décisions du projet</label><textarea class="field" id="memo" placeholder="Priorités, blocages, prochaines étapes…">'+esc(d.memo||'')+'</textarea><div class="actions"><button id="save-memo" class="primary">Enregistrer</button><button id="copy-memo">Copier pour le chat de gestion</button>'+external(d.projectUrl,'Chat de gestion dans ChatGPT','button')+'</div></section><section class="panel"><h2>Suivi du code</h2><p class="muted">Pour UCP, retrouve les résultats Codex et les changements GitHub dans le dépôt associé.</p><div class="links">'+external(p.repo?'https://github.com/'+OWNER+'/'+encodeURIComponent(p.repo)+'/pulls':'','Pull requests GitHub')+external(p.repo?'https://github.com/'+OWNER+'/'+encodeURIComponent(p.repo)+'/commits':'','Historique des modifications')+external('https://chatgpt.com/codex','Ouvrir Codex')+'</div></section>';
$('#save-memo').onclick=()=>{d.memo=$('#memo').value;persist();notify('Notes enregistrées sur cet appareil.')};
$('#copy-memo').onclick=async()=>{d.memo=$('#memo').value;persist();try{await navigator.clipboard.writeText('GESTION DE PROJET — '+nameOf(p)+'\n\n'+d.memo+'\n\nPrends en compte ces notes et coordonne les travaux liés au projet, sans inventer de synchronisation avec les autres IA.');notify('Consignes copiées. Colle-les dans le chat de gestion.')}catch{notify('Copie indisponible sur cet appareil.')}};
}
function connections(p,d,el){
el.innerHTML='<section class="panel"><h2>Rattacher ton espace ChatGPT</h2><p class="muted">Le lien permet d’ouvrir directement ton projet dans ChatGPT. Il n’accorde pas à CONTROL l’accès à son historique.</p><form id="project-form"><label>URL du projet ChatGPT<input class="field" type="url" name="url" value="'+attr(d.projectUrl||'')+'" placeholder="https://chatgpt.com/g/g-p-…"></label><button class="primary">Enregistrer le lien</button></form></section><section class="panel"><h2>Autres IA et clés API</h2><div class="notice">Ne colle aucune clé secrète ici. Ce site est statique et public : l’import et l’écriture des conversations d’autres fournisseurs nécessitent des autorisations officielles, un serveur privé et des API compatibles. Les abonnements ChatGPT, Claude ou Gemini ne fournissent pas automatiquement l’accès API.</div><p class="muted">Pour le moment, relie les conversations par leur URL depuis l’onglet « Conversations ». Tu peux également sauvegarder des liens vers Drive et d’autres outils dans « Ressources ».</p></section><section class="panel"><h2>Sauvegarde locale</h2><p class="muted">Les informations ajoutées sur un appareil ne se synchronisent pas avec les autres. Exporte tes raccourcis pour les conserver.</p><button id="export">Exporter mes liens (JSON)</button></section>';
$('#project-form').onsubmit=e=>{e.preventDefault();const u=String(new FormData(e.target).get('url')).trim();if(u&&!chatHost(u))return notify('Lien ChatGPT non valide.');d.projectUrl=u;persist();connections(p,d,el);notify('Lien du projet enregistré.')};
$('#export').onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='control-projets.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
}
function settings(){active=null;$('#main').innerHTML='<a class="back" href="#/">← Mes projets</a><h1>Connexions</h1><section class="panel"><h2>Fonctionnement</h2><p>CONTROL centralise les liens de tes projets, tes discussions et tes ressources. Les conversations restent ouvertes dans leur application d’origine. Pour les modifier sans quitter CONTROL, une infrastructure authentifiée et les API officielles seraient nécessaires.</p><div class="notice">Aucune clé API n’est demandée ni stockée. Aucune dépense n’est engagée.</div></section><section class="panel"><h2>Accès rapides</h2><div class="links">'+external('https://chatgpt.com/','ChatGPT · Projets')+external('https://chatgpt.com/codex','Codex')+external('https://drive.google.com/','Google Drive')+'</div></section>'}
function render(){let r=route();if(r.id){let p=projects.find(p=>p.id===r.id);if(p)return workspace(p,r.tab);location.hash='#/';return}r.tab==='settings'?settings():home()}
async function init(){const data=await Promise.allSettled(['data/projects.json','data/catalog.json'].map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})));const baseProjects=data[0].status==='fulfilled'?(data[0].value.projects||[]):[],catalog=data[1].status==='fulfilled'?(data[1].value.projects||[]):[];projects=[...baseProjects,...catalog,...(state.custom||[])];if(!projects.length)$('#main').innerHTML='<div class="notice">Catalogue inaccessible. Vérifie ta connexion réseau puis recharge la page.</div>';else render()}
window.addEventListener('hashchange',render);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='home')location.hash='#/';if(b.dataset.go==='settings')location.hash='#/settings';if(b.dataset.go==='current'){if(active)go(active,tab);else location.hash='#/'}});init();
})();
</script><script defer src="assets/pwa.js"></script></body></html>
