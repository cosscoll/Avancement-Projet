nt{padding:12px 0}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#233553;color:white;border-radius:12px;padding:12px 17px;z-index:5;max-width:90vw}.danger{color:#9e3838}@media(max-width:640px){.wrap{padding:16px 14px 100px}.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px;min-height:143px}.badge{margin-bottom:13px}.card strong{font-size:14px}.panel{padding:15px}.row .button{font-size:13px}.desktoponly{display:none}}@media(max-width:370px){.grid{grid-template-columns:1fr}}

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s), base='control-hub-v2', OWNER='cosscoll';
const load=()=>{try{const data=JSON.parse(localStorage.getItem(base)||'{}');return data&&typeof data==='object'&&!Array.isArray(data)?data:{}}catch{return{}}};
let state=load(),projects=[],active=null,tab='discussions',showAllProjects=false;
const persist=()=>{try{localStorage.setItem(base,JSON.stringify(state));return true}catch{notify('Stockage local indisponible : tes modifications ne sont pas enregistrées.');return false}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc;
const link=u=>{try{const x=new URL(u);return x.protocol==='https:'&&!x.username&&!x.password?x.href:''}catch{return''}};
const chatHost=u=>{try{const x=new URL(u);return x.protocol==='https:'&&!x.username&&!x.password&&['chatgpt.com','claude.ai','gemini.google.com','notebooklm.google.com','aistudio.google.com','github.com','perplexity.ai','www.perplexity.ai','poe.com'].includes(x.hostname)}catch{return false}};
const nameOf=p=>p.name||p.short||p.id;
function notify(msg){const n=$('#toast');n.textContent=msg;n.classList.remove('hidden');clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>n.classList.add('hidden'),3600)}
function scoped(id){const d=state[id];if(!d||typeof d!=='object'||Array.isArray(d))state[id]={chats:[],links:[],memo:'',projectUrl:'',agents:[]};return state[id]}
function external(url,label,cls='link'){const safe=link(url);return safe?'<a class="'+cls+'" href="'+attr(safe)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+' <span aria-hidden="true">↗</span></a>':''}
function go(id,t='ai'){tab=t;location.hash='#/project/'+encodeURIComponent(id)+'/'+t;render()}
function route(){const s=decodeURIComponent(location.hash.slice(1));const m=s.match(/^\/project\/([^/]+)(?:\/([^/]+))?/);return m?{id:m[1],tab:m[2]||'ai'}:{id:null,tab:s==='/settings'?'settings':'home'}}
function home(){
 active=null;
 const search='<input id="search" class="field search" type="search" aria-label="Rechercher un projet" placeholder="Rechercher un projet…" autocomplete="off">';
 $('#main').innerHTML='<section class="clarity-intro"><div class="toprow"><div><div class="quiet">TON ESPACE DE TRAVAIL</div><h1>Mes projets</h1><p class="muted">Retrouve rapidement ton travail et tes IA.</p></div><button id="add-project" class="primary">+ Nouveau projet</button></div>'+
 '<div class="clarity-shortcuts"><a href="#/control/inbox" class="clarity-shortcut"><strong>À traiter</strong><span>Mes priorités →</span></a><a href="#/control/localai" class="clarity-shortcut"><strong>Discuter avec CONTROL IA</strong><span>IA générative locale →</span></a><a href="#/control/tools" class="clarity-shortcut"><strong>Tous les outils</strong><span>Explorer à mon rythme →</span></a></div></section>'+
 '<section class="clarity-projects"><div class="toprow clarity-listhead"><h2>Projets <span class="clarity-count">'+projects.length+'</span></h2></div>'+search+'<div id="cards" class="grid clarity-cards"></div><div class="clarity-more"><button type="button" id="more-projects" hidden>Afficher tous les projets</button></div></section>'+
 '<details class="clarity-helpnote"><summary>Comment retrouver les conversations de mes IA ?</summary><p>CONTROL ouvre les projets ChatGPT et Claude depuis leurs liens officiels. Les conversations privées ne sont pas importées automatiquement dans ce site.</p></details>'+
 '<section id="add-box" class="panel hidden"><h2>Nouveau projet</h2><form id="new-project"><label>Nom du projet<input class="field" name="name" required maxlength="90" placeholder="Ex. Mon nouveau projet"></label><label>Lien du projet ChatGPT (facultatif)<input name="url" class="field" type="url" placeholder="https://chatgpt.com/g/g-p-…"></label><button class="primary">Créer l’espace</button></form></section>';
 const draw=()=>{
  const q=($('#search').value||'').toLowerCase().trim();
  const recentIds=Array.isArray(state.uxRecent)?state.uxRecent:[];
  const byRecent=new Map(recentIds.map((v,i)=>[v,i]));
  const visible=projects.filter(p=>nameOf(p).toLowerCase().includes(q)).sort((a,b)=>(byRecent.get(a.id)??999)-(byRecent.get(b.id)??999));
  const limit=q||showAllProjects?visible.length:6;
  $('#cards').innerHTML=visible.slice(0,limit).map(p=>'<a class="card" href="#/project/'+encodeURIComponent(p.id)+'/ai"><div class="badge">'+esc(p.symbol||nameOf(p).slice(0,2).toUpperCase())+'</div><strong>'+esc(nameOf(p))+'</strong><small>'+esc(p.category||'Espace projet')+'</small></a>').join('')||'<p class="empty">Aucun projet trouvé.</p>';
  const more=$('#more-projects');more.hidden=Boolean(q)||visible.length<=6;more.textContent=showAllProjects?'Afficher moins de projets':'Afficher tous les projets ('+visible.length+')';
 };
 draw();$('#search').oninput=draw;
 $('#more-projects').onclick=()=>{showAllProjects=!showAllProjects;draw()};
 $('#add-project').onclick=()=>{$('#add-box').classList.toggle('hidden');if(!$('#add-box').classList.contains('hidden'))$('#add-box input[name="name"]').focus()};
 $('#new-project').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')).trim(),url=String(fd.get('url')).trim();if(!name)return;if(url&&!chatHost(url)){notify('Utilise un lien ChatGPT valide.');return}const id='custom-'+(globalThis.crypto?.randomUUID?.()||Date.now());const p={id,name,symbol:name.slice(0,2).toUpperCase(),category:'Projet personnalisé'};const previous=Array.isArray(state.custom)?state.custom.slice():[];state.custom=[...previous,p];scoped(id).projectUrl=url;if(!persist()){state.custom=previous;delete state[id];notify('Projet non créé : impossible d’enregistrer sur cet appareil. Libère de l’espace ou vérifie les paramètres du navigateur.');return}projects.push(p);go(id)};
}
function workspace(p,t){
 active=p.id;tab=t;
 if(!Array.isArray(state.uxRecent))state.uxRecent=[];
 if(state.uxRecent[0]!==p.id){state.uxRecent=[p.id,...state.uxRecent.filter(x=>x!==p.id)].slice(0,8);persist()}
 const d=scoped(p.id),tabs=[['ai','Espaces IA'],['discussions','Conversations'],['pilot','Gestion'],['resources','Ressources']],moreTabs=[['localai','CONTROL IA locale'],['meetings','Visios'],['command','Commander mes IA'],['library','Outils IA'],['deploy','Mise en ligne'],['lab','Laboratoire IA'],['connect','Connexions']];
 const advanced=moreTabs.some(x=>x[0]===t);
const nav=tabs.map(([id,label])=>'<button data-tab="'+id+'" role="tab" aria-selected="'+(id===t)+'">'+label+'</button>').join('');
const advancedNav='<details class="clarity-more-tabs" '+(advanced?'open':'')+'><summary>Plus'+(advanced?' · '+esc(moreTabs.find(x=>x[0]===t)?.[1]):'')+'</summary><div class="clarity-advanced">'+moreTabs.map(([id,label])=>'<button type="button" data-tab="'+id+'" aria-current="'+(id===t?'page':'false')+'">'+label+'</button>').join('')+'</div></details>';
$('#main').innerHTML='<a class="back" href="#/">← Tous les projets</a><div class="toprow"><div><span class="quiet">'+esc(p.category||'Projet')+'</span><h1>'+esc(nameOf(p))+'</h1><p class="muted">'+esc(p.tagline||p.summary||'Centralisez vos espaces de travail.')+'</p></div><div class="actions"><a class="button primary" href="#/control/manager?project='+encodeURIComponent(p.id)+'">Piloter ce projet</a>'+external(d.projectUrl,'ChatGPT','button')+'</div></div><div class="clarity-work-nav"><div class="tabs" role="tablist">'+nav+'</div>'+advancedNav+'</div><div id="section"></div>';
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(p.id,b.dataset.tab));
const target=$('#section');
if(t==='resources')resources(p,d,target);
else if(t==='localai'){target.innerHTML='<section class="panel"><h2>CONTROL IA locale</h2><p>Discute directement avec un modèle génératif sur ton appareil, sans compte ni clé API. Premier téléchargement uniquement après ton accord.</p><a class="button primary" href="#/control/localai?project='+encodeURIComponent(p.id)+'">Discuter avec CONTROL IA →</a></section>'}
else if(t==='meetings'){target.innerHTML='<section class="panel"><h2>Visios et rendez-vous</h2><p>Organise les réunions de ton équipe et les appels clients ou prospects. Retrouve liens, invitations et comptes rendus.</p><a class="button primary" href="#/control/meetings?project='+encodeURIComponent(p.id)+'">Organiser une visio →</a></section>'}
else if(t==='command'){target.innerHTML='<section class="panel"><h2>Claude + Gemini</h2><p>Prépare une même mission, retrouve chaque réponse et les vérifications dans un seul écran. Les envois API directs ne sont pas encore activés.</p><a class="button primary" href="#/control/command?project='+encodeURIComponent(p.id)+'">Ouvrir le poste de commande →</a></section>'}
else if(t==='lab'){target.innerHTML='<section class="panel"><h2>Laboratoire IA du projet</h2><p>Prépare des briefs avec les données de ce projet, compare les réponses des IA et contrôle les fichiers produits avant validation.</p><a class="button primary" href="#/control/lab?project='+encodeURIComponent(p.id)+'">Ouvrir les 7 outils IA →</a></section>'}
else if(t==='deploy'){target.innerHTML='<section class="panel"><h2>Mettre le site en ligne</h2><p>Tutoriels GitHub Pages, IONOS, Vercel et autres hébergeurs, avec un assistant de déploiement par prompt IA, checklist et vérifications.</p><a class="button primary" href="#/control/deploy?project='+encodeURIComponent(p.id)+'">Voir les guides de déploiement →</a></section>'}
else if(t==='library'){target.innerHTML='<section class="panel"><h2>Bibliothèque d’outils IA</h2><p>Retrouve les outils adaptés à ton projet parmi les quatre parcours IAgile. Tu peux enregistrer les outils intéressants dans les ressources du projet.</p><a class="button primary" href="#/control/catalog?project='+encodeURIComponent(p.id)+'">Explorer les 87 outils IA →</a></section>'}
else if(t==='ai')ai(p,d,target);
else if(t==='pilot')pilot(p,d,target);
else if(t==='connect')connections(p,d,target);
else discussions(p,d,target);
}
function discussions(p,d,el){
const chats=d.chats||[];
el.innerHTML='<section class="panel"><div class="sectionhead"><div><h2>Discussions du projet</h2><span class="muted">'+chats.length+' conversation(s) liées manuellement</span></div><button class="primary" id="show-chat">+ Ajouter un chat</button></div><div class="notice">Pour répondre dans un chat existant, ouvre sa conversation ChatGPT ou l’IA concernée. CONTROL n’a pas accès aux messages privés depuis GitHub Pages.</div><div id="chat-list">'+(chats.length?chats.map((c,i)=>'<div class="chatrow"><div><strong>'+esc(c.title)+'</strong><small>'+esc(c.ai||'ChatGPT')+'</small></div><div class="actions">'+external(c.url,'Ouvrir','button')+'<button data-remove-chat="'+i+'" aria-label="Délier la conversation">×</button></div></div>').join(''):'<p class="empty">Aucune conversation liée. Ajoute le lien d’un chat du projet.</p>')+'</div><form id="chat-form" class="hidden" style="margin-top:20px"><label>Nom de la discussion<input class="field" name="title" required maxlength="100" placeholder="Ex. Développement application"></label><label>IA<input class="field" name="ai" list="ai-list" placeholder="ChatGPT" value="ChatGPT"><datalist id="ai-list"><option>ChatGPT</option><option>Codex</option><option>Claude</option><option>Gemini</option><option>Autre</option></datalist></label><label>Lien de la conversation<input class="field" type="url" name="url" required placeholder="https://chatgpt.com/c/…"></label><button class="primary">Lier la conversation</button></form></section><section class="panel"><h2>Créer une conversation</h2><p class="muted">Ouvre un nouveau chat dans ton IA. Pour qu’il appartienne à ce projet ChatGPT, crée-le depuis le projet dans ChatGPT, puis reviens coller son lien ici.</p><div class="actions">'+external(d.projectUrl,'Ouvrir le projet ChatGPT','button primary')+external('https://chatgpt.com/','ChatGPT nouveau chat','button')+external('https://chatgpt.com/codex','Codex','button')+'</div></section>';
$('#show-chat').onclick=()=>$('#chat-form').classList.toggle('hidden');
$('#chat-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),url=String(f.get('url')).trim();if(!chatHost(url)){notify('Lien de conversation non reconnu.');return}d.chats.push({title:String(f.get('title')).trim(),ai:String(f.get('ai')).trim()||'ChatGPT',url});persist();discussions(p,d,el)};
el.querySelectorAll('[data-remove-chat]').forEach(b=>b.onclick=()=>{d.chats.splice(Number(b.dataset.removeChat),1);persist();discussions(p,d,el)});
}

const IA_PROVIDERS=[
 {id:'ChatGPT',base:'https://chatgpt.com/',hint:'Ouvre le projet dans ChatGPT et copie son adresse depuis la barre d’adresse.',type:'Projet ChatGPT'},
 {id:'Claude',base:'https://claude.ai/projects',hint:'Dans Claude → Projets, ouvre le projet souhaité, puis copie son adresse.',type:'Projet Claude'},
 {id:'Gemini',base:'https://gemini.google.com/',hint:'Dans Gemini → Notebooks, ouvre le notebook du projet et copie son adresse.',type:'Notebook Gemini'},
 {id:'Codex',base:'https://chatgpt.com/codex',hint:'Ouvre la tâche ou l’espace Codex lié à ce projet et copie son adresse.',type:'Tâche Codex'},
 {id:'Perplexity',base:'https://www.perplexity.ai/',hint:'Ouvre l’espace ou la recherche associée à ce projet et copie son adresse.',type:'Espace externe'}
];

function platformLinkValid(id,url,d){

function ai(p,d,el){
 d.spaces??={};d.reports??={};d.chats??=[];

 return '<article class="panel ia-card"><div class="row"><div class="ia-heading"><div class="badge">'+esc(x.id.slice(0,2))+'</div><div><h2>'+esc(x.id)+'</h2><span class="muted">'+esc(x.type)+'</span></div></div><span class="chip">'+(url?'Lien enregistré':'À relier')+'</span></div>'+

 }).join('');
 el.innerHTML='<section class="hint"><h2>Espaces IA du projet</h2><p class="muted">Un clic ouvre directement le véritable projet dans l’IA concernée. Les conversations s’affichent dans cette IA, avec ta session habituelle. Les liens et bilans sont conservés sur cet appareil.</p><button id="add-provider">+ Ajouter une autre IA</button></section><div class="ia-grid">'+card+'</div><section class="panel hidden" id="provider-editor"><h2>Ajouter une IA</h2><form id="provider-form"><label>Nom de l’IA<input class="field" name="name" required maxlength="50" placeholder="Ex. Mistral ou Grok"></label><button class="primary">Ajouter cet espace IA</button></form></section>'+
 '<section class="panel hidden" id="space-editor"><h2 id="space-editor-title">Associer un projet</h2><p class="muted" id="space-hint"></p><form id="space-form"><input type="hidden" name="provider" id="space-provider"><label>URL de cet espace<input class="field" type="url" name="url" id="space-url" required placeholder="https://…"></label><div class="actions"><button class="primary">Enregistrer</button><button type="button" id="space-cancel">Annuler</button><a id="space-start" class="button" target="_blank" rel="noopener noreferrer">Ouvrir l’IA ↗</a></div></form><p class="muted">Ne colle jamais un lien de partage public si tu souhaites conserver le projet privé : privilégie l’URL du projet dans la barre d’adresse.</p></section>'+
 '<section class="panel hidden" id="report-editor"><h2 id="report-editor-title">Compte rendu</h2><p class="muted">Le compte rendu ne se met pas à jour tout seul : récupère le bilan depuis l’IA, puis colle-le ci-dessous. N’inclus aucun secret.</p><button id="copy-report-prompt">Copier la demande de bilan pour cette IA</button><form id="report-form"><input type="hidden" name="provider" id="report-provider"><label>Dernier bilan vérifié<textarea class="field" name="text" id="report-text" maxlength="20000" rows="9" required placeholder="Travaux terminés, en cours, blocages et prochaines étapes…"></textarea></label><div class="actions"><button class="primary">Enregistrer le bilan</button><button id="report-cancel" type="button">Annuler</button></div></form></section>';
 function editSpace(id){const x=providerDefs(d).find(p=>p.id===id);if(!x)return;$('#space-editor').classList.remove('hidden');$('#report-editor').classList.add('hidden');$('#space-provider').value=id;$('#space-url').value=providerUrl(d,id);$('#space-editor-title').textContent='Associer '+x.type;$('#space-hint').textContent=x.hint;$('#space-start').href=x.base;$('#space-start').textContent='Ouvrir '+id+' ↗';$('#space-editor').scrollIntoView({block:'nearest',behavior:'smooth'})}
 function editReport(id){if(!providerDefs(d).some(x=>x.id===id))return;$('#report-editor').classList.remove('hidden');$('#space-editor').classList.add('hidden');$('#report-provider').value=id;$('#report-text').value=d.reports[id]?.text||'';$('#report-editor-title').textContent='Bilan · '+id;$('#report-editor').scrollIntoView({block:'nearest',behavior:'smooth'})}

 $('#report-form').onsubmit=e=>{e.preventDefault();const id=$('#report-provider').value,txt=$('#report-text').value.trim();if(!txt)return;d.reports[id]={text:txt,updatedAt:new Date().toISOString(),source:'manual'};persist();ai(p,d,el);notify('Bilan '+id+' enregistré.')};
 $('#copy-report-prompt').onclick=()=>copyText(reportPrompt(p,$('#report-provider').value));

function resources(p,d,el){
const defaults=[...(p.repo?[{label:'Dépôt GitHub',url:'https://github.com/'+OWNER+'/'+encodeURIComponent(p.repo)}]:[]),...(p.website?.url?[{label:p.website.label||'Site web',url:p.website.url}]:[]),...(p.other_sites||[]),...providerDefs(d).filter(x=>providerUrl(d,x.id)).map(x=>({label:'Espace '+x.id,url:providerUrl(d,x.id)}))],links=[...defaults,...(d.links||[])];

$('#show-link').onclick=()=>$('#link-form').classList.toggle('hidden');
$('#link-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),url=link(f.get('url'));if(!url)return notify('Adresse HTTPS obligatoire.');d.links.push({label:String(f.get('label')).trim(),url});persist();resources(p,d,el)};
el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{d.links.splice(+b.dataset.del,1);persist();resources(p,d,el)});

function pilot(p,d,el){
 d.reports??={};d.pilotChat??=[];d.spaces??={};
 const hasReport=providerDefs(d).some(x=>d.reports[x.id]?.text);
 function answer(question){
  const q=question.toLowerCase();const x=providerDefs(d).find(v=>q.includes(v.id.toLowerCase()));
  if(!hasReport)return 'Aucun bilan IA enregistré pour '+nameOf(p)+'. Dans « Espaces IA », demande un bilan à ChatGPT, Claude, Gemini ou Codex, puis colle-le. Je ne peux pas lire leurs conversations privées en direct.';
  const targets=x?[x.id]:IA_PROVIDERS.map(t=>t.id);
  return 'État de '+nameOf(p)+(x?' sur '+x.id:' par IA')+' (bilans enregistrés, pas de synchronisation en direct) :\n\n'+targets.map(id=>{
    const r=d.reports[id];
    return id+' · '+(r?.text?'mis à jour '+new Date(r.updatedAt).toLocaleString('fr-FR')+'\n'+r.text:'Aucun rapport reçu.');
  }).join('\n\n---\n\n')+'\n\nCes informations ont été fournies manuellement ; vérifie leurs dates et leurs preuves avant de décider.';
 }
 function transcript(){return '<div id="pilot-thread">'+(d.pilotChat.length?d.pilotChat.slice(-12).map(m=>'<div class="pilot-message '+(m.role==='user'?'pilot-user':'pilot-answer')+'"><span class="muted">'+(m.role==='user'?'Vous':'Synthèse locale')+'</span><p>'+esc(m.content)+'</p></div>').join(''):'<p class="empty">Demande « Où en est le projet ? » ou « Que dit Claude ? ». Le gestionnaire s’appuie uniquement sur les bilans enregistrés.</p>')+'</div>'}
 el.innerHTML='<section class="panel"><div class="sectionhead"><h2>Gestion centrale · '+esc(nameOf(p))+'</h2><span class="chip">Synthèse locale</span></div><div class="notice">Ce module répond à partir des bilans que tu lui fournis. Il ne lit pas automatiquement tes chats ChatGPT, Claude, Gemini ou Codex et n’invente pas leurs résultats.</div>'+transcript()+'<form id="pilot-ask"><label>Question sur le projet<input id="pilot-question" name="question" class="field" required maxlength="700" placeholder="Où en est chaque IA ?"></label><button class="primary">Interroger les bilans</button></form><div class="actions"><button id="pilot-summary">Afficher tous les bilans</button><button id="pilot-clear">Effacer cet historique local</button></div></section>'+
 '<section class="panel"><h2>État par espace IA</h2><div class="reports-overview">'+aiOverview(p,d)+'</div><div class="actions"><button id="pilot-to-ai" class="primary">Mettre à jour les bilans dans Espaces IA</button><button id="pilot-copy-all">Copier la synthèse complète pour ChatGPT</button></div></section>'+
 (p.objectives?.length?'<section class="panel"><h2>État de référence du projet</h2><p class="muted">Instantané public enregistré précédemment dans CONTROL (référence du 16/10/2026). Il ne reflète pas automatiquement les échanges récents des IA.</p><p><strong>'+esc(p.status||'Statut non indiqué')+'</strong></p>'+p.objectives.map(o=>{const cs=o.criteria||[],done=cs.filter(c=>c.done).length;return '<div class="chatrow"><div><strong>'+esc(o.name)+'</strong><small>'+done+' critère(s) renseigné(s) sur '+cs.length+' · sans valeur de progression commerciale</small></div></div>'}).join('')+'</section>':'')+
 '<section class="panel"><h2>Consignes et décisions</h2><p class="muted">Notes de travail enregistrées uniquement dans ce navigateur.</p><textarea class="field" id="memo" placeholder="Priorités, blocages, prochaines étapes…">'+esc(d.memo||'')+'</textarea><button id="save-memo">Enregistrer les notes</button></section>'+
 (p.repo?'<section class="panel"><h2>Activité du dépôt GitHub</h2><p class="muted">Commits publics du dépôt ; un commit n’est pas automatiquement une réalisation de ChatGPT ou Codex.</p><button id="pilot-git-refresh">Vérifier les derniers commits publics</button><div id="pilot-github" class="reports-overview muted">Clique pour consulter l’activité.</div></section>':'');
 function addQuestion(question){const q=String(question).trim();if(!q)return;d.pilotChat.push({role:'user',content:q,at:new Date().toISOString()});d.pilotChat.push({role:'assistant',content:answer(q),at:new Date().toISOString()});d.pilotChat=d.pilotChat.slice(-30);persist();pilot(p,d,el)}
 $('#pilot-ask').onsubmit=e=>{e.preventDefault();addQuestion($('#pilot-question').value)};
 $('#pilot-summary').onclick=()=>addQuestion('Où en est chaque IA du projet ?');
 $('#pilot-clear').onclick=()=>{d.pilotChat=[];persist();pilot(p,d,el)};

 $('#pilot-copy-all').onclick=()=>copyText('SYNTHÈSE MULTI-IA — '+nameOf(p)+'\n\n'+answer('Où en est chaque IA ?')+'\n\nPriorités internes :\n'+(d.memo||'Aucune note')+'\n\nAnalyse ce contexte et signale les incohérences. Ne considère pas les bilans manuels comme une synchronisation en temps réel.');
 $('#save-memo').onclick=()=>{d.memo=$('#memo').value;persist();notify('Notes enregistrées.')};
 el.querySelectorAll('[data-connect-go]').forEach(b=>b.onclick=()=>go(p.id,'ai'));
 const refresh=$('#pilot-git-refresh');if(refresh)refresh.onclick=async()=>{const out=$('#pilot-github');out.textContent='Chargement…';try{const response=await fetch('https://api.github.com/repos/'+OWNER+'/'+encodeURIComponent(p.repo)+'/commits?per_page=5',{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error(response.status);const commits=await response.json();out.innerHTML=Array.isArray(commits)&&commits.length?commits.map(c=>'<div class="chatrow"><div><strong>'+esc((c.commit?.message||'').split('\n')[0])+'</strong><small>'+esc(c.commit?.committer?.date?new Date(c.commit.committer.date).toLocaleString('fr-FR'):'Date inconnue')+'</small></div>'+external(c.html_url,'GitHub','button')+'</div>').join(''):'Aucun commit disponible.'}catch{out.textContent='Impossible de charger les commits publics pour le moment.'}};
}
function connections(p,d,el){
 d.spaces??={};d.reports??={};
 el.innerHTML='<section class="panel"><h2>Connecter les espaces des IA</h2><p>Associe le lien de chaque projet ChatGPT, Claude, Gemini ou Codex depuis l’onglet « Espaces IA ». L’application ouvrira alors directement cet espace.</p><button id="conn-open-ia" class="primary">Gérer les projets IA</button></section><section class="panel"><h2>Google Drive et autres dossiers</h2><p class="muted">Dans « Ressources », ajoute l’adresse du dossier Drive de ce projet. Une connexion OAuth sera nécessaire pour naviguer automatiquement dans les fichiers depuis CONTROL.</p><button id="conn-open-resources">Gérer les ressources</button></section><section class="panel"><h2>Synchronisation des statuts</h2><div class="notice">Le gestionnaire central utilise les comptes rendus que tu colles dans « Espaces IA ». Il ne peut pas lire en direct des projets privés de services externes. Ne saisis ici aucune clé API, mot de passe ou jeton.</div></section><section class="panel"><h2>Sauvegarder mes associations</h2><p class="muted">Les liens, bilans et notes restent sur cet appareil. Exporte un fichier JSON pour les transférer sur un autre appareil ; traite ce fichier comme privé.</p><div class="actions"><button id="export">Exporter JSON</button><label class="button" for="import-json">Importer JSON</label><input type="file" id="import-json" accept="application/json,.json" class="hidden"></div></section>';
 $('#conn-open-ia').onclick=()=>go(p.id,'ai');
 $('#conn-open-resources').onclick=()=>go(p.id,'resources');
 $('#export').onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='control-projets.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
 $('#import-json').onchange=async e=>{const f=e.target.files?.[0];if(!f||f.size>2500000)return notify('Fichier absent ou supérieur à 2,5 Mo.');try{const v=JSON.parse(await f.text());if(!v||typeof v!=='object'||Array.isArray(v))throw Error('invalid');if(!window.confirm('Remplacer les liens et bilans locaux de CONTROL par ce fichier ?'))return;state=v;persist();projects=[...projects.filter(x=>!x.id.startsWith('custom-')),...(state.custom||[])];notify('Données importées sur cet appareil.');connections(p,scoped(p.id),el)}catch{notify('Format JSON invalide.')}};
}
function settings(){active=null;$('#main').innerHTML='<a class="back" href="#/">← Mes projets</a><h1>Connexions</h1><section class="panel"><h2>Fonctionnement</h2><p>CONTROL centralise les liens de tes projets, tes discussions et tes ressources. Les conversations restent ouvertes dans leur application d’origine. Pour les modifier sans quitter CONTROL, une infrastructure authentifiée et les API officielles seraient nécessaires.</p><div class="notice">Aucune clé API n’est demandée ni stockée. Aucune dépense n’est engagée.</div></section><section class="panel"><h2>Accès rapides</h2><div class="links">'+external('https://chatgpt.com/','ChatGPT · Projets')+external('https://chatgpt.com/codex','Codex')+external('https://drive.google.com/','Google Drive')+'</div></section>'}

 const workspaceRoot=document.querySelector('#main');
 window.CONTROL_VISIOS?.unmount?.(workspaceRoot);

async function init(){const data=await Promise.allSettled(['data/projects.json','data/catalog.json'].map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})));const baseProjects=data[0].status==='fulfilled'?(data[0].value.projects||[]):[],catalog=data[1].status==='fulfilled'?(data[1].value.projects||[]):[];projects=[...baseProjects,...catalog,...(Array.isArray(state.custom)?state.custom.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'):[])];if(!projects.length)$('#main').innerHTML='<div class="notice">Catalogue inaccessible. Vérifie ta connexion réseau puis recharge la page.</div>';else render()}
window.addEventListener('hashchange',render);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='home')location.hash='#/';if(b.dataset.go==='settings')location.hash='#/settings';if(b.dataset.go==='automations')location.hash='#/automations';if(['inbox','manager','tools'].includes(b.dataset.go))location.hash='#/control/'+b.dataset.go;if(b.dataset.go==='current'){if(active)go(active,tab);else location.hash='#/'}});window.CONTROL_HELP?.setAdapter({mode:'personal',isAuthenticated:()=>true,getSummary:()=>({projects:projects.length,current:active?projects.find(p=>p.id===active)?.name:'',openActions:JSON.parse(localStorage.getItem('control-command-v1')||'{}').actions?.filter(x=>x.status!=='done')?.length||0,missions:JSON.parse(localStorage.getItem('control-command-v1')||'{}').missions?.length||0})});init();
